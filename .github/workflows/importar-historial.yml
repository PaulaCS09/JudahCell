{"name": "Importar historial JUDAH CELL", "on": {"push": {"paths": ["judah-cell.bundle", ".github/workflows/importar-historial.yml"]}, "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"importar": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4", "with": {"fetch-depth": 0}}, {"name": "Importar bundle", "run": "if [ ! -f judah-cell.bundle ]; then echo 'No hay bundle'; exit 0; fi; set -e; git config user.name 'JUDAH CELL'; git config user.email 'dev@judahcell.local'; git bundle verify judah-cell.bundle; git fetch ./judah-cell.bundle main:importado; git merge importado --allow-unrelated-histories --no-edit -m 'Importar historial del MVP JUDAH CELL'; git rm -q judah-cell.bundle; git commit -m 'Quitar archivo temporal de importacion'; git push origin HEAD:main"}]}}}
